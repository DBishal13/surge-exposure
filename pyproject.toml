[project]
name = "surge-exposure"
version = "0.1.0"
description = "Storm-surge & flood exposure pipeline for utility/property assets"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "requests>=2.32",
    "leafmap>=0.42",
    "folium>=0.17",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "pyarrow>=17.0",
    "rasterio>=1.3",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
